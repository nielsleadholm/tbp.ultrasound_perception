# @package experiment.config.environment

env_init_func: ${monty.class:custom_classes.probe_triggered_environment.ProbeTriggeredUltrasoundEnvironment}
env_init_args:
  image_listen_port: 3000
  save_path: ${path.expanduser:${oc.env:MONTY_DATA}/ultrasound_data_collection/observations}
  vive_url: ${oc.env:VIVE_SERVER_URL,http://localhost:3001/pose}
transform:
  - _target_: ${monty.class:custom_classes.transforms.UltrasoundPatchTransform}
    patch_size: 256
