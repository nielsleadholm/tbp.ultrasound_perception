# @package _global_

# Distant-agent simulation inference on the scanned tbp_robot_lab objects, using the
# model pretrained in simulation. Provides a simulation baseline to compare against the
# real-world ultrasound inference results.

defaults:
  - /monty: graph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: informed_random_walk_20
  - /monty/learning_module: evidence_1lm_nn10_dod003_dts02_gsg0
  - /monty/sensor_module: camera_dist_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_tbp_robot_lab_dist_agent_semantics0
  - /env_interface: eval_tbp_robot_lab_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    n_eval_epochs: 10
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/ultrasound_robot_lab_v1/surf_agent_1lm_tbp_robot_lab/pretrained/}
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    logging:
      run_name: randrot_noise_dist_sim_on_scan_tbp_robot_lab
      output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/ultrasound}
