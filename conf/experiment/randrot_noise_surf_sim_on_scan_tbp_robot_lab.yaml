# @package _global_

# Surface-agent simulation inference on the scanned tbp_robot_lab objects, using the
# model pretrained in simulation. In our real-world experiments the sensor can move
# around the object, so we allow a goal-state-driven surface policy here too. Provides
# a simulation baseline to compare against the real-world ultrasound inference results.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn10_dod0025
  - /monty/sensor_module: camera_surf_noise_raw1
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_tbp_robot_lab_surf_agent
  - /env_interface: eval_tbp_robot_lab_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 5000
    n_train_epochs: 3
    n_eval_epochs: 10
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/ultrasound_robot_lab_v1/surf_agent_1lm_tbp_robot_lab/pretrained/}
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    logging:
      run_name: randrot_noise_surf_sim_on_scan_tbp_robot_lab
      output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/ultrasound}
