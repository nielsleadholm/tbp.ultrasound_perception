# @package _global_

# Inference on the sparse dataset using a model learned (real-to-real) from the dense
# offline dataset.

defaults:
  - /monty: ultrasound_evidence
  - /monty/motor_system_config: ultrasound
  - /monty/learning_module: ultrasound_evidence_1lm
  - /monty/sensor_module: ultrasound
  - /monty/connectivity: ultrasound_1lm_1sm
  - /environment: ultrasound_robot_lab_sparse
  - /env_interface: ultrasound_eval
  - /env_interface/transform: none
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: custom_classes.experiment.UltrasoundInferenceExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 50
    max_total_steps: 4000
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/ultrasound_robot_lab_v1/json_dataset_ultrasound_dense_learning/pretrained/}
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    monty_config:
      monty_args:
        min_eval_steps: 20
    logging:
      run_name: ultrasound_real2real_dense_learning_sparse_inference
      output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/ultrasound}
