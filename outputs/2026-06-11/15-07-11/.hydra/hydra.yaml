hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://tbp.monty.conf
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=randrot_noise_dist_sim_on_scan_tbp_robot_lab
    - print_cfg=true
  job:
    name: run
    chdir: null
    override_dirname: experiment=randrot_noise_dist_sim_on_scan_tbp_robot_lab,print_cfg=true
    id: ???
    num: ???
    config_name: experiment
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /Users/nleadholm/tbp.ultrasound_perception
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/nleadholm/tbp.ultrasound_perception/conf
      schema: file
      provider: main
    - path: tbp.monty.conf
      schema: pkg
      provider: tbp.monty
    - path: tbp.monty.conf
      schema: pkg
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/nleadholm/tbp.ultrasound_perception/outputs/2026-06-11/15-07-11
    choices:
      experiment: randrot_noise_dist_sim_on_scan_tbp_robot_lab
      logging: basic_warning_wandb_monty_runs
      env_interface/transform: missing_depthto3d_sensor2_semantic0
      env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
      env_interface: eval_tbp_robot_lab_dist
      environment: habitat_tbp_robot_lab_dist_agent
      environment@experiment.config.environment.environment: habitat_numentalab_dist_agent_semantics0
      monty/connectivity: 1lm_1sm
      monty/sensor_module: camera_dist_noise_raw1_salience
      monty/learning_module: evidence_1lm_nn10_dod003
      monty/motor_system_config: distant_5
      monty: evidencegraph_exp1000_emin_t3_tot2500
      constants: defaults
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
